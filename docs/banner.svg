<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-wear-tiles: Wear OS Tiles made simple" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2a26"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5468"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8ad9b0" flood-opacity="0.55"/>
    </filter>
    <clipPath id="face">
      <circle cx="965" cy="280" r="178"/>
    </clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="176" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-2">compose-wear-tiles</text>
    <text x="82" y="230" fill="#c9f2dc" font-size="26" font-weight="500">Wear OS Tiles made simple: ProtoLayout</text>
    <text x="82" y="266" fill="#c9f2dc" font-size="26" font-weight="500">layouts, fresh data and previews</text>
    <text x="82" y="326" fill="#8ad9b0" font-size="19" font-family="'JetBrains Mono', Menlo, monospace">TileState(ProgressTile(goal), RefreshPolicy.everyMinutes(15))</text>
    <g font-size="17" font-weight="600" fill="#eefaf3">
      <rect x="82" y="360" width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="138" y="384" text-anchor="middle">Progress</text>
      <rect x="204" y="360" width="86" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="247" y="384" text-anchor="middle">Stats</text>
      <rect x="300" y="360" width="122" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="361" y="384" text-anchor="middle">Shortcuts</text>
      <rect x="432" y="360" width="128" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="496" y="384" text-anchor="middle">Countdown</text>
      <rect x="82" y="406" width="176" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="170" y="430" text-anchor="middle">Refresh policies</text>
      <rect x="268" y="406" width="186" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="361" y="430" text-anchor="middle">Studio previews</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="895" y="22" width="140" height="70" rx="22" fill="#232a38"/>
      <rect x="895" y="468" width="140" height="70" rx="22" fill="#232a38"/>
      <circle cx="965" cy="280" r="192" fill="url(#case)"/>
      <rect x="1149" y="254" width="18" height="52" rx="7" fill="#4a5468"/>
      <circle cx="965" cy="280" r="178" fill="#000000"/>
    </g>
    <text x="965" y="152" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Steps</text>
    <rect x="843" y="172" width="244" height="146" rx="40" fill="#1c252e"/>
    <circle cx="905" cy="245" r="38" fill="none" stroke="#26313b" stroke-width="9"/>
    <path d="M905 207 A38 38 0 1 1 872.9 224.6" fill="none" stroke="#8ad9b0" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
    <path transform="translate(887 227) scale(1.5)" fill="#8ad9b0" d="M13.5,5.5c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM9.8,8.9L7,23h2.1l1.8,-8 2.1,2v6h2v-7.5l-2.1,-2 0.6,-3C14.8,12 16.8,13 19,13v-2c-1.9,0 -3.5,-1 -4.3,-2.4l-1,-1.6c-0.4,-0.6 -1,-1 -1.7,-1 -0.3,0 -0.5,0.1 -0.8,0.1L6,8.3V13h2V9.6l1.8,-0.7"/>
    <text x="958" y="250" fill="#e6edf3" font-size="36" font-weight="600">8,421</text>
    <text x="959" y="278" fill="#b4c0cb" font-size="16">of 10k steps</text>
    <g clip-path="url(#face)">
      <rect x="872" y="346" width="186" height="130" rx="44" fill="#8ad9b0"/>
    </g>
    <text x="965" y="394" fill="#00382a" font-size="19" font-weight="700" text-anchor="middle">Log walk</text>
  </g>
</svg>
